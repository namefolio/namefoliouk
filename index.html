<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Namefolio — Premium Domain Names</title>
    <meta
      name="description"
      content="Namefolio is a private portfolio of premium domain names and a targeted outbound service for domain owners."
    />
    <link rel="canonical" href="https://namefolio.co.uk/" />
    <meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)" />
    <style>
      html { background: #f4f2ed; color: #171816; }
      html[data-theme='dark'] { background: #141513; color: #eceae3; }
    </style>
    <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var theme
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Namefolio" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://namefolio.co.uk/" />
    <meta property="og:title" content="Namefolio — Premium Domain Names" />
    <meta
      property="og:description"
      content="Namefolio is a private portfolio of premium domain names and a targeted outbound service for domain owners."
    />
    <meta property="og:image" content="https://namefolio.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Namefolio — Digital assets, selectively acquired." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Namefolio — Premium Domain Names" />
    <meta
      name="twitter:description"
      content="Namefolio is a private portfolio of premium domain names and a targeted outbound service for domain owners."
    />
    <meta name="twitter:image" content="https://namefolio.co.uk/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Namefolio — a private portfolio of premium domain names. Contact:
        <a href="mailto:hello@namefolio.co.uk">hello@namefolio.co.uk</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
