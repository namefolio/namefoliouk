<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Namefolio — Domain Portfolio</title>
    <meta
      name="description"
      content="Premium .co.uk domains that create instant trust and credibility."
    />
    <link rel="canonical" href="https://namefolio.co.uk/" />
    <meta name="theme-color" content="#F4F2ED" />
    <meta name="color-scheme" content="light only" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Namefolio" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://namefolio.co.uk/" />
    <meta property="og:title" content="Namefolio — Domain Portfolio" />
    <meta
      property="og:description"
      content="Premium .co.uk domains that create instant trust and credibility."
    />
    <meta property="og:image" content="https://namefolio.co.uk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Namefolio.co.uk" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Namefolio — Domain Portfolio" />
    <meta
      name="twitter:description"
      content="Premium .co.uk domains that create instant trust and credibility."
    />
    <meta name="twitter:image" content="https://namefolio.co.uk/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Inlined into the page at build time (see vite.config.ts). -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="mx-auto flex min-h-svh w-full max-w-[44rem] flex-col px-6 pt-16 pb-10 md:px-10 md:pt-28 md:pb-14">
      <main class="flex-1">
        <p class="enter display text-xl md:text-2xl">Namefolio.</p>

        <h1 class="enter display mt-12 text-[clamp(2.5rem,9vw,4rem)] md:mt-16" style="--delay: 100ms">
          <span class="block">Build Authority.</span> <span class="block">Own the Category.</span>
        </h1>

        <p class="enter mt-6 max-w-[34rem] text-xl leading-[1.5] text-muted md:text-2xl" style="--delay: 150ms">
          Premium .co.uk domains that create instant trust and credibility.
        </p>

        <ul class="enter mt-14 border-t border-rule md:mt-20" style="--delay: 200ms">
          <li class="border-b border-rule">
            <a class="group flex items-baseline justify-between gap-4 py-5 text-lg font-medium md:text-xl" href="https://farmreservoirs.co.uk" target="_blank" rel="noopener">
              <span>FarmReservoirs.co.uk</span>
              <span aria-hidden="true" class="text-muted transition-transform duration-300 group-hover:translate-x-1 group-hover:text-ink">→</span>
            </a>
          </li>
          <li class="border-b border-rule">
            <a class="group flex items-baseline justify-between gap-4 py-5 text-lg font-medium md:text-xl" href="https://gridconnection.co.uk" target="_blank" rel="noopener">
              <span>GridConnection.co.uk</span>
              <span aria-hidden="true" class="text-muted transition-transform duration-300 group-hover:translate-x-1 group-hover:text-ink">→</span>
            </a>
          </li>
          <li class="border-b border-rule">
            <a class="group flex items-baseline justify-between gap-4 py-5 text-lg font-medium md:text-xl" href="https://farmrobot.co.uk" target="_blank" rel="noopener">
              <span>FarmRobot.co.uk</span>
              <span aria-hidden="true" class="text-muted transition-transform duration-300 group-hover:translate-x-1 group-hover:text-ink">→</span>
            </a>
          </li>
        </ul>
      </main>

      <footer class="mt-20 flex flex-wrap justify-between gap-x-6 gap-y-2 text-sm text-muted">
        <a class="underline-offset-4 hover:text-ink hover:underline" href="mailto:hello@namefolio.co.uk">hello@namefolio.co.uk</a>
        <p>© 2026 Namefolio</p>
      </footer>
    </div>
  </body>
</html>
